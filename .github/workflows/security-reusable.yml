# The workspace secret-scanning gate, defined once and called by every repo.
#
# Rule and why: CroftC/.claude/SUPPLY-CHAIN.md rules 1 and 2. Rollout Phase 1 of
# discovery/alpha/plans/2026-08-29-plan-supply-chain-rollout.md.
#
# WHY ONE FILE RATHER THAN EIGHTEEN. croft-pwa owns the CI standard (docs/CI.md), and
# the scanner version must be PINNED — a floating `@latest` scanner is the same class of
# bug as a shadowing cargo-clippy (CI-PATTERN rule 7). Eighteen copies of a pinned
# version string is eighteen places to forget.
#
# WHY A PUBLIC HOST. Five repos here have no CI at all, and croft-stack and CroftC are
# PRIVATE — exactly the two GitHub's own free secret scanning does not cover, and the
# reason this gate exists rather than relying on it (GitHub alerts; a gate blocks).
# Verified 2026-08-29: `gh api repos/CroftCommunity/croft-pwa/actions/permissions/access`
# returns HTTP 422 "Access policy only applies to internal and private repositories", so
# a public host is callable from everywhere.
#
# Callers do this and nothing else:
#   jobs:
#     secrets:
#       uses: CroftCommunity/croft-pwa/.github/workflows/security-reusable.yml@main
#
# A repo needing extra allowlists adds `.gitleaks-extra.toml` at its root containing
# only `[[allowlists]]` tables; this workflow appends it to the base below. It is an
# EXTENSION point, not an override — the base rules cannot be switched off by a caller.

name: security-reusable

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Pinned gitleaks release, without the leading v."
        type: string
        default: "8.30.1"
      osv-scanner-version:
        description: >-
          Pinned osv-scanner release, without the leading v. This is the version the
          gate's classifier was VALIDATED against (2026-08-29, four named cases in
          the rollout plan's Phase 2). Bumping it means re-running those four, not
          just watching CI stay green — the classifier reads osv-scanner's JSON
          schema, and `dependency_groups` going missing would silently turn every
          npm dev-only finding into a block.
        type: string
        default: "2.3.5"
      deps-enforce:
        description: >-
          Whether a blocking dependency finding fails the build. Default true, and
          that default is MEASURED, not brave: the gate was run across all 18 repos
          on 2026-08-29 and reported zero blocking findings in every one. The staged
          "advisory first" rollout the plan sketched was insurance against a backlog
          that turned out not to exist, and an advisory gate nobody has to fix is
          how a gate becomes decoration.
        type: boolean
        default: true
      advisory-paths:
        description: >-
          Newline-separated repo-relative prefixes whose findings are reported but
          never block, because nothing under them is shipped — frozen spikes, proofs,
          archives. This is a claim about what the repo PUBLISHES, so it belongs with
          the caller rather than in the shared config. It is load-bearing where it is
          used: discovery reports 0 blocking findings with its three prefixes set and
          215 without them, all in research code that ships nothing.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    # CI-PATTERN rule 8: a job with no timeout inherits GitHub's six-hour default, and
    # a scan that hangs rather than fails sits there for all of it.
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is load-bearing, not caution. Rule 2 is about scanning the PR's
      # COMMIT RANGE, and a shallow checkout cannot see a reverted commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          V="${{ inputs.gitleaks-version }}"
          B="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          # Download under the EXACT published filename: `sha256sum -c` reads the name
          # out of the checksum line and opens that path, so renaming on the way in
          # makes the check fail to find its own file. Observed 2026-08-29.
          curl -sSfL -O "${B}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -O "${B}/gitleaks_${V}_checksums.txt"
          # A supply-chain gate that installs an unverified binary is not one. The
          # pipe-straight-to-tar form this replaces could not check anything: the
          # bytes were consumed before they could be hashed.
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      # The workspace baseline. Every allowlist below was derived from a MEASURED false
      # positive across all 18 repos on 2026-08-29, never from a guess. Before it, an
      # unconfigured scan reported 7,084 findings workspace-wide — 6,995 in arecipe
      # alone — with ZERO true positives. After it, 15 remain, all prose, and 16 of 18
      # repos are clean. That ratio is the whole argument for the file: a scanner
      # adopted at 7,000 findings is a permanent mute, not a gate.
      - name: Write the workspace baseline config
        run: |
          set -euo pipefail
          cat > /tmp/gitleaks-base.toml <<'BASETOML'
          [extend]
          useDefault = true

          # Machine-generated, content-addressed, and public by construction. High
          # entropy is what these files ARE; it is not evidence of a secret.
          [[allowlists]]
          description = "lockfile checksums, build snapshots, dist output"
          targets = ["path"]
          paths = [
            '''(^|/)Cargo\.lock$''',
            '''(^|/)package-lock\.json$''',
            '''(^|/)uv\.lock$''',
            '''(^|/)gradle\.lockfile$''',
            '''(^|/)assets/snapshot/''',
            '''(^|/)dist/''',
            '''(^|/)node_modules/''',
          ]

          # Test vectors are SUPPOSED to look like keys; that is what makes them vectors.
          [[allowlists]]
          description = "cryptographic conformance vectors"
          targets = ["path"]
          paths = [
            '''(^|/)conformance/vectors/''',
            '''(^|/)conformance-vectors/''',
          ]

          # atproto and DID identifiers are PUBLIC by specification. publicKeyMultibase
          # is a public key; an rkey is a record identifier. Matched against the LINE,
          # not the secret — the default target is the matched string, which does not
          # contain the surrounding context that makes these identifiable.
          [[allowlists]]
          description = "atproto/DID public identifiers"
          regexTarget = "line"
          regexes = [
            '''publicKeyMultibase''',
            '''Multikey''',
            '''Ed25519VerificationKey''',
            '''did:(plc|web|key):''',
            '''(?i)r_?key''',
          ]

          # Real private keys, committed on purpose, as fixtures. Allowlisted BY PATH so
          # the private-key rule keeps firing everywhere else — it is the rule that found
          # these, and it is exactly the one worth keeping loud.
          [[allowlists]]
          description = "deliberate SSH test fixtures"
          targets = ["path"]
          paths = ['''(^|/)tests?/fixtures/id_ed25519''']

          # The config files themselves. An allowlist that DOCUMENTS a false positive by
          # quoting it re-creates that false positive in its own comments — observed
          # 2026-08-29, when discovery's freshly-landed .gitleaks-extra.toml failed the
          # gate on line 12 of its own rationale. Excluding the config is not a loophole:
          # a real credential does not belong in a scanner config either, and anything
          # pasted there is by definition already declared.
          [[allowlists]]
          description = "the gitleaks config files themselves"
          targets = ["path"]
          paths = [
            '''(^|/)\.gitleaks\.toml$''',
            '''(^|/)\.gitleaks-extra\.toml$''',
          ]
          BASETOML

          # Per-repo extension: appended, never substituted. `[[allowlists]]` is an
          # array-of-tables, so concatenation is the documented way to extend it.
          if [ -f .gitleaks-extra.toml ]; then
            echo "appending .gitleaks-extra.toml"
            printf '\n' >> /tmp/gitleaks-base.toml
            cat .gitleaks-extra.toml >> /tmp/gitleaks-base.toml
          fi

      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ -n "${BASE:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            # PR: scan the RANGE, not the head commit. Rule 2 — and MEASURED, not
            # assumed, against gitleaks 8.30.1 on 2026-08-29 with a ghp_ token added in
            # one commit and reverted in the next:
            #   --log-opts="HEAD~1..HEAD"  -> 0 commits scanned, NO LEAKS FOUND
            #   --log-opts="BASE..HEAD"    -> leaks found: 1
            #   (no --log-opts)            -> leaks found: 1
            # The head-only form is what a naive gate uses, and it misses the leak
            # entirely because the tip commit only deletes the file.
            echo "scanning commit range ${BASE}..${HEAD_SHA}"
            ./gitleaks git --log-opts="${BASE}..${HEAD_SHA}" \
              --redact --no-banner -c /tmp/gitleaks-base.toml .
          else
            # push / schedule / dispatch: the whole history, which is where a secret
            # scanner earns its keep — the leak is usually older than the PR.
            echo "scanning full history"
            ./gitleaks git --redact --no-banner -c /tmp/gitleaks-base.toml .
          fi
          rc=$?

          # A gate whose failure does not name its own rule gets cargo-culted around.
          # --redact is not optional: 20 of these repos are public, so an unredacted
          # finding in a log is a SECOND disclosure.
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Secret detected::gitleaks found a candidate credential. Rule: CroftC/.claude/SUPPLY-CHAIN.md rule 1 — secrets are scanned everywhere, public and private, and the gate blocks. If this is a deliberate fixture, add it to .gitleaks-extra.toml BY PATH with a reason. Never disable the scan."
          fi
          exit "$rc"

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate script lives beside this workflow but does not travel with it — a
      # reusable workflow checks out the CALLER's repo, not its own. So we fetch it,
      # at `github.job_workflow_sha`: the commit of the REUSABLE workflow being run,
      # which is the only context that means "the version of me the caller asked
      # for". `github.workflow_sha` is the caller's commit — the wrong repo entirely
      # — and a hardcoded `main` cannot even bootstrap: the first run of this job
      # fetched a main that did not have the script yet and died on a missing
      # directory (observed 2026-08-29). Pinning to the workflow's own SHA makes
      # script/workflow skew impossible for every caller, tag-pinned ones included.
      - name: Fetch the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CroftCommunity/croft-pwa
          ref: ${{ github.job_workflow_sha }}
          path: .security-tooling
          sparse-checkout: .github/scripts

      # The classifier's own tests run HERE, in every caller, on every run — not in
      # croft-pwa's vitest suite. Most callers have no Node toolchain, so a suite
      # only croft-pwa runs is a check the other seventeen never invoke
      # (VERIFICATION.md, "a check nothing invokes"). Running them first means a
      # broken classifier fails loudly instead of waving findings through.
      - name: Test the classifier
        working-directory: .security-tooling/.github/scripts
        run: python3 test_dep_gate.py

      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          set -euo pipefail
          V="${{ inputs.osv-scanner-version }}"
          B="https://github.com/google/osv-scanner/releases/download/v${V}"
          curl -sSfL -O "${B}/osv-scanner_linux_amd64"
          curl -sSfL -O "${B}/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --version

      - name: Scan dependencies
        env:
          ADVISORY_PATHS: ${{ inputs.advisory-paths }}
          ENFORCE: ${{ inputs.deps-enforce }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r p; do
            if [ -n "$p" ]; then args+=(--advisory-path "$p"); fi
          done <<< "$ADVISORY_PATHS"
          # An `if` and not `[ x = y ] && args+=(...)`: under `set -e` the && form
          # exits the step with status 1 the moment enforcement is OFF, which turns
          # "advisory mode" into a hard failure and looks exactly like a real finding.
          if [ "$ENFORCE" = "true" ]; then args+=(--enforce); fi
          python3 .security-tooling/.github/scripts/dep_gate.py \
            --root . --scanner "$PWD/osv-scanner" "${args[@]}"
