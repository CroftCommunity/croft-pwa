name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The manual path. GitHub throttles *webhook deliveries* during an Actions
  # incident (observed 2026-08-06: pushes stopped triggering runs for hours), and
  # dispatch is exempt — it is the only way to gate and publish while that lasts.
  # `preview.yml` already calls dispatch "the RELIABLE path" for the same reason;
  # the gate needs it just as much. See docs/CI.md §8.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # A job with no timeout inherits GitHub's 6-hour default. A test that hangs
    # rather than fails will sit there for all of it — and a hang reports as
    # "every test passed, run failed", which is not a shape anyone reads quickly.
    # See docs/CI.md §7.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers change only when Playwright's version does, so key the cache on
      # the lockfile. `--with-deps` still runs on a hit: the system libraries it
      # installs live outside this directory, and it is seconds once the binaries
      # are already there.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The one gate, identical to `npm run test` locally:
      # lint · typecheck · unit · build · e2e.
      - run: npm test
      # A browser failure is close to unreadable without its trace and
      # screenshots — without this the next step is pushing console.log commits
      # to inspect a machine you cannot open.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publish the built dist/ to the ROOT of the gh-pages branch, which GitHub
  # Pages serves. Why a branch and not the Actions/artifact source: per-PR
  # previews (.github/workflows/preview.yml) live in gh-pages:/pr-preview/pr-N/,
  # and a repo can have only one Pages source. The deploy publishes to the branch
  # root while PRESERVING pr-preview/, so a production deploy never wipes a live
  # preview. Set Pages source to "Deploy from a branch → gh-pages / root".
  # The push is plain git (scripts/pages-deploy.sh) — no third-party deploy action.
  # Dispatch-safe by construction: this job REBUILDS the site rather than
  # consuming an artifact uploaded by `gate`, so it has no step conditioned on
  # the event name that could skip under `workflow_dispatch`. The sibling `fun`
  # repo publishes via an artifact and had exactly that bug — its upload was
  # gated `if: github.event_name == 'push'` while its deploy was gated on the ref
  # alone, so a dispatch skipped the upload and then failed looking for it. If
  # you switch this to an artifact-based deploy, the publish steps must be
  # conditioned `!= 'pull_request'`, never `== 'push'`. See docs/CI.md §8.
  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the built site to the gh-pages branch
    # Serialize every writer of gh-pages (this job + the preview workflow) so
    # they never race on `git push`.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/pages-deploy.sh root dist "deploy ${{ github.sha }} to Pages"
